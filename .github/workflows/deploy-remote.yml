name: Deploy remote Docker Compose

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH_HOST, SSH_USER, or SSH_PRIVATE_KEY secret"
            exit 1
          fi

      - name: Prepare SSH key file
        run: |
          set -e
          KEY_PATH="${{ runner.temp }}/deploy_key"
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
        shell: bash

      - name: "Copy compose to remote"
        uses: appleboy/scp-action@v0.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # Use key_path instead of passing raw key to avoid parsing issues
          key_path: ${{ runner.temp }}/deploy_key
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          source: 'deploy/docker-compose.remote.yml'
          target: '~/nirmaan_deploy/docker-compose.remote.yml'

      - name: "SSH: Pull images and run compose"
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # Use the prepared key file path
          key_path: ${{ runner.temp }}/deploy_key
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            mkdir -p ~/nirmaan_deploy
            mv ~/nirmaan_deploy/docker-compose.remote.yml ~/nirmaan_deploy/docker-compose.remote.yml || true
            cd ~/nirmaan_deploy
            export GITHUB_OWNER='${{ secrets.GITHUB_OWNER }}'
            docker compose -f docker-compose.remote.yml pull || true
            docker compose -f docker-compose.remote.yml up -d
