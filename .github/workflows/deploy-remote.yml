name: Deploy remote Docker Compose

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH_HOST, SSH_USER, or SSH_PRIVATE_KEY secret"
            exit 1
          fi

      - name: Prepare SSH key file
        run: |
          set -e
          KEY_PATH="${{ runner.temp }}/deploy_key"
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
        shell: bash

      - name: Copy compose and run on remote via scp/ssh
        run: |
          set -euo pipefail
          KEY_PATH="${{ runner.temp }}/deploy_key"
          REMOTE="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          PORT="${{ secrets.SSH_PORT }}"
          mkdir -p ~/nirmaan_deploy || true
          # Ensure remote path exists and copy the file
          scp -o StrictHostKeyChecking=no -P "${PORT}" -i "${KEY_PATH}" deploy/docker-compose.remote.yml "${REMOTE}:~/nirmaan_deploy/docker-compose.remote.yml"
          ssh -o StrictHostKeyChecking=no -i "${KEY_PATH}" -p "${PORT}" "${REMOTE}" 'set -e; mkdir -p ~/nirmaan_deploy; cd ~/nirmaan_deploy; docker compose -f docker-compose.remote.yml pull || true; docker compose -f docker-compose.remote.yml up -d'
        shell: bash
