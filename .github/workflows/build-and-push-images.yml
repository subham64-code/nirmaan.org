name: Build and push Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, proctoring]
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.service == 'backend' && 'backend' || (matrix.service == 'frontend' && 'frontend') || 'nirmaan_exam.org' }}
          file: ${{ matrix.service == 'backend' && 'backend/Dockerfile' || (matrix.service == 'frontend' && 'frontend/Dockerfile') || 'nirmaan_exam.org/Dockerfile' }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/nirmaan-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/nirmaan-${{ matrix.service }}:latest

  deploy:
    name: Deploy to remote host
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for images to be available
        run: sleep 10

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '~' }}
            if [ -f deploy/docker-compose.remote.yml ]; then
              docker compose -f deploy/docker-compose.remote.yml pull --ignore-pull-failures
              docker compose -f deploy/docker-compose.remote.yml up -d
            else
              echo 'deploy/docker-compose.remote.yml not found'; exit 1
            fi
