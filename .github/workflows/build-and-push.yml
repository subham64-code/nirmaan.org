name: Build and Push Docker images

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_OWNER: ${{ secrets.GITHUB_OWNER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ secrets.GITHUB_OWNER }}/nirmaan-backend:${{ github.sha }}
            ghcr.io/${{ secrets.GITHUB_OWNER }}/nirmaan-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ secrets.GITHUB_OWNER }}/nirmaan-frontend:${{ github.sha }}
            ghcr.io/${{ secrets.GITHUB_OWNER }}/nirmaan-frontend:latest

      - name: Build and push proctoring image
        uses: docker/build-push-action@v4
        with:
          context: ./nirmaan_exam.org
          file: ./nirmaan_exam.org/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ secrets.GITHUB_OWNER }}/nirmaan-proctoring:${{ github.sha }}
            ghcr.io/${{ secrets.GITHUB_OWNER }}/nirmaan-proctoring:latest

