name: Build and push Docker images

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Allow fetching submodules; use provided token or fallback to GITHUB_TOKEN
          token: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Debug: list workspace
        run: |
          echo "PWD: $(pwd)"
          echo "Listing root:" 
          ls -la
          echo "Listing repo contents recursively (top 2 levels):"
          find . -maxdepth 2 -type d -print || true
          echo "Check nirmaan_exam.org exists:" 
          test -d "nirmaan_exam.org" && echo "OK: nirmaan_exam.org present" || echo "MISSING: nirmaan_exam.org"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Prefer a personal access token with package write permission if provided,
          # otherwise fall back to the default GITHUB_TOKEN.
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nirmaan-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nirmaan-frontend:latest

      - name: Build and push proctoring image
        uses: docker/build-push-action@v4
        with:
          context: ./nirmaan_exam.org
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nirmaan-proctoring:latest
