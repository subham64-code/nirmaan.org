name: Nirmaan CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    # removed defaults.run. Provide working-directory on individual run steps
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Debug: list proctoring workspace
        working-directory: backend
        run: |
          echo "PWD: $(pwd)"
          ls -la
          test -d "../nirmaan_exam.org" && echo "OK: ../nirmaan_exam.org present" || test -d "nirmaan_exam.org" && echo "OK: nirmaan_exam.org present" || echo "MISSING: nirmaan_exam.org"
        

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend smoke test
        working-directory: backend
        run: npm run test

  frontend:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    # removed defaults.run. Provide working-directory on individual run steps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  proctoring:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install proctoring dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r nirmaan_exam.org/requirements.txt

      - name: Compile Flask proctoring modules
        run: |
          python -m py_compile \
            nirmaan_exam.org/app_modern.py \
            nirmaan_exam.org/proctoring_ml.py \
            nirmaan_exam.org/run_production.py
