services:
  mongodb:
    image: mongo:8
    container_name: nirmaan-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: nirmaan-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - proctoring

  frontend:
    build:
      context: ./frontend
    container_name: nirmaan-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend

  proctoring:
    build:
      context: ./nirmaan_exam.org
    container_name: nirmaan-proctoring
    restart: unless-stopped
    env_file:
      - ./nirmaan_exam.org/.env
    ports:
      - "5001:5001"
    depends_on:
      - mongodb

volumes:
  mongodb_data:
